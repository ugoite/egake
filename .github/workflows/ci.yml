name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: mise run docs:ci
      - run: mise run fmt:check
      - run: mise run check
      - run: mise run test
      - run: mise run deno:fmt:check
      - run: mise run deno:check
      - run: mise run deno:test
      - run: mise run python:test
