[workspace]
resolver = "2"
members = [
    "crates/egake-resource",
    "crates/egake-spec",
    "crates/egake-data",
    "crates/egake-server",
    "crates/egake-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
