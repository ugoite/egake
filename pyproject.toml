[project]
name = "egake-python-quality"
version = "0.1.0"
description = "Reproducible quality tooling for egake's Python host adapter"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = ["ty==0.0.65"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE"]

[tool.ty.environment]
python-version = "3.13"
extra-paths = ["python"]
