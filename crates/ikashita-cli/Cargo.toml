[package]
name = "ikashita-cli"
description = "Command-line entry point for the ikashita toolchain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ikashita"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ikashita-csv = { path = "../ikashita-csv" }
ikashita-resource = { path = "../ikashita-resource" }
ikashita-server = { path = "../ikashita-server" }
ikashita-spec = { path = "../ikashita-spec" }
kdl = "=6.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.43", features = ["net", "rt-multi-thread"] }
toml = "0.9"

[lints]
workspace = true
