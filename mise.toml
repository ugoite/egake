min_version = "2025.11.3"

[tools]
rust = "1.94.0"
deno = "2.8.3"
python = "3.13.5"
node = "22.14.0"
ruff = "0.16.1"
uv = "0.11.7"

[env]
CARGO_TARGET_DIR = "target/rust"

[tasks.setup]
description = "Install the Python quality environment and show the pinned toolchain"
depends = ["install-hooks", "python:install"]
run = [
    "rustc --version",
    "cargo --version",
    "deno --version",
    "python --version",
    "ruff --version",
    "uv --version",
    "uv run --locked ty --version",
]

[tasks."ui:build"]
description = "Build the checked-in Tailwind v4 browser runtime stylesheet"
sources = [
    "crates/egake-cli/assets/runtime.css.src",
    "crates/egake-cli/assets/runtime.js",
    "packages/runtime/src/application.ts",
    "package.json",
    "deno.lock",
]
outputs = ["crates/egake-cli/assets/runtime.css"]
run = "deno run --frozen --node-modules-dir=auto -A npm:@tailwindcss/cli@4.3.0 --input crates/egake-cli/assets/runtime.css.src --output crates/egake-cli/assets/runtime.css --minify"

[tasks."ui:check"]
description = "Check that the checked-in Tailwind runtime stylesheet is reproducible"
run = "bash scripts/check-runtime-ui.sh"

[tasks.fmt]
description = "Format Rust, Deno, and Python sources"
depends = ["rust:fmt", "deno:fmt", "python:fmt"]

[tasks."fmt:check"]
description = "Check formatting for Rust, Deno, and Python"
depends = ["rust:fmt:check", "deno:fmt:check", "python:fmt:check"]

[tasks.lint]
description = "Run lint checks for Rust, Deno, and Python"
depends = ["rust:lint", "deno:lint", "python:lint"]

[tasks.check]
description = "Type-check Rust, Deno, and Python"
depends = ["rust:check", "deno:check", "python:typecheck"]

[tasks.test]
description = "Run Rust, Deno, and Python tests"
depends = ["rust:test", "deno:test", "python:test"]

[tasks."rust:fmt"]
description = "Format all Rust sources"
run = "cargo fmt --all"

[tasks."rust:fmt:check"]
description = "Check Rust formatting without changing files"
run = "cargo fmt --all --check"

[tasks."rust:ci-setup"]
description = "Install Rust formatter and Clippy for the active CI toolchain"
# mise 2025.11.3 pins Rust but cannot declare rustup components in mise.toml.
run = '''
rust_toolchain="$(rustup show active-toolchain | awk 'NR == 1 { print $1 }')"
test -n "$rust_toolchain"
rustup component add rustfmt clippy --toolchain "$rust_toolchain"
'''

[tasks."rust:lint"]
description = "Run Clippy with warnings treated as errors"
depends = ["ui:check"]
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks."rust:check"]
description = "Type-check every Rust workspace target"
depends = ["ui:check"]
run = "cargo check --workspace --all-targets"

[tasks."rust:test"]
description = "Run all Rust workspace tests"
depends = ["ui:check"]
run = "cargo test --workspace"

[tasks.build]
description = "Build every workspace target"
depends = ["ui:check"]
run = "cargo build --workspace"

[tasks."deno:fmt"]
description = "Format TypeScript/Deno host packages and examples"
run = "deno fmt packages examples/js-embedded examples/ugoite-entries"

[tasks."deno:fmt:check"]
description = "Check TypeScript/Deno formatting"
run = "deno fmt --check packages examples/js-embedded examples/ugoite-entries"

[tasks."deno:lint"]
description = "Lint TypeScript/Deno host packages and examples"
run = "deno lint packages examples/js-embedded examples/ugoite-entries"

[tasks."deno:check"]
description = "Type-check the TypeScript/Deno host packages and examples"
run = "deno check packages/runtime/mod.ts packages/react/mod.ts packages/vue/mod.ts packages/solid/mod.ts packages/svelte/mod.ts examples/js-embedded/main.ts examples/js-embedded/main_test.ts examples/ugoite-entries/adapter.ts examples/ugoite-entries/adapter_test.ts"

[tasks."deno:test"]
description = "Run deterministic TypeScript/Deno host tests"
run = "deno test packages/runtime/tests packages/react/tests packages/vue/tests packages/solid/tests packages/svelte/tests examples/js-embedded/main_test.ts examples/ugoite-entries/adapter_test.ts"

[tasks."python:install"]
description = "Install the locked Python type-checking environment"
run = "uv sync --locked --python 3.13"

[tasks."python:fmt"]
description = "Format Python sources and examples"
run = "ruff format python examples scripts"

[tasks."python:fmt:check"]
description = "Check Python formatting without changing files"
run = "ruff format --check python examples scripts"

[tasks."python:lint"]
description = "Run Ruff lint on Python sources, examples, and quality scripts"
run = "ruff check python examples scripts"

[tasks."python:typecheck"]
description = "Run the locked ty type checker on Python sources and examples"
depends = ["python:install"]
run = "uv run --locked ty check python examples scripts"

[tasks."python:test"]
description = "Run standard-library Python host adapter tests"
run = "PYTHONPATH=python python -m unittest discover -s python/tests -t python"

[tasks."docs:install"]
description = "Install the locked Astro Starlight docsite dependencies"
run = "npm --prefix docsite ci"

[tasks."docs:check"]
description = "Check repository documentation and the Starlight site"
depends = ["docs:fmt:check", "docs:i18n:check"]
run = [
    "python scripts/check_docs.py",
    "npm --prefix docsite run check",
]

[tasks."docs:i18n:check"]
description = "Check Japanese/English documentation pairs and sync markers"
depends = ["docs:install"]
run = "npm --prefix docsite run i18n:check"

[tasks."docs:i18n:update"]
description = "Explicitly update Japanese/English documentation sync markers"
depends = ["docs:install"]
run = "npm --prefix docsite run i18n:update"

[tasks."docs:fmt:check"]
description = "Check docsite configuration formatting"
depends = ["docs:install"]
run = "npm --prefix docsite run format:check"

[tasks."docs:build"]
description = "Build and check the local-default Astro Starlight docsite (base=/)"
depends = ["docs:check"]
env = { DOCSITE_BASE = "/" }
run = [
    "npm --prefix docsite run build",
    "python scripts/check_doc_links.py --dist docsite/dist --base \"${DOCSITE_BASE:-/}\"",
]

[tasks."docs:build:pages"]
description = "Build and check the GitHub Pages Astro Starlight docsite (base=/egake/)"
depends = ["docs:check"]
env = { DOCSITE_BASE = "egake" }
run = [
    "npm --prefix docsite run build",
    "python scripts/check_doc_links.py --dist docsite/dist --base \"${DOCSITE_BASE:-/}\"",
]

[tasks."docs:build:both"]
description = "Build and check the docsite with both supported base paths"
depends = ["docs:build"]
run = "mise run docs:build:pages"

[tasks."docs:ci"]
description = "Run the reproducible docsite install, checks, and production build"
depends = ["docs:build:both"]

[tasks."git:hygiene"]
description = "Audit tracked and reachable generated, secret, and cache paths"
run = "bash scripts/audit-git-hygiene.sh"

[tasks."brand:check"]
description = "Reject stale product paths and text"
run = "bash scripts/check-brand.sh"

[tasks.ci]
description = "Run the complete local validation suite"
depends = ["fmt:check", "lint", "check", "test", "build", "deno:fmt:check", "deno:check", "deno:test", "python:test", "docs:ci", "git:hygiene", "brand:check"]

[tasks.install-hooks]
description = "Configure the repository-local pre-commit hook"
run = "git config core.hooksPath .githooks"
