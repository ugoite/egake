min_version = "2025.11.3"

[tools]
rust = "1.94.0"
deno = "2.8.3"
python = "3.13.5"
node = "22.14.0"

[env]
CARGO_TARGET_DIR = "target/rust"

[tasks.setup]
description = "Show the pinned toolchain and install the local Git hooks"
depends = ["install-hooks"]
run = [
    "rustc --version",
    "cargo --version",
    "if command -v deno >/dev/null 2>&1; then deno --version; else echo 'Deno is not installed; no Deno task is required by the Rust foundation'; fi",
]

[tasks.fmt]
description = "Format all Rust sources"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check Rust formatting without changing files"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Run Clippy with warnings treated as errors"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.check]
description = "Type-check every workspace target"
run = "cargo check --workspace --all-targets"

[tasks.test]
description = "Run all workspace tests"
run = "cargo test --workspace"

[tasks.build]
description = "Build every workspace target"
run = "cargo build --workspace"

[tasks."deno:fmt"]
description = "Format TypeScript/Deno host packages and examples"
run = "deno fmt packages examples/js-embedded examples/ugoite-entries"

[tasks."deno:fmt:check"]
description = "Check TypeScript/Deno formatting"
run = "deno fmt --check packages examples/js-embedded examples/ugoite-entries"

[tasks."deno:check"]
description = "Type-check the TypeScript/Deno host packages and examples"
run = "deno check packages/runtime/mod.ts packages/react/mod.ts packages/vue/mod.ts examples/js-embedded/main.ts examples/js-embedded/main_test.ts examples/ugoite-entries/adapter.ts examples/ugoite-entries/adapter_test.ts"

[tasks."deno:test"]
description = "Run deterministic TypeScript/Deno host tests"
run = "deno test packages/runtime/tests packages/react/tests packages/vue/tests examples/js-embedded/main_test.ts examples/ugoite-entries/adapter_test.ts"

[tasks."python:test"]
description = "Run standard-library Python host adapter tests"
run = "PYTHONPATH=python python -m unittest discover -s python/tests -t python"

[tasks."docs:install"]
description = "Install the locked Astro Starlight docsite dependencies"
run = "npm --prefix docsite ci"

[tasks."docs:check"]
description = "Check the docsite and verify that docs/ remains its single source of truth"
depends = ["docs:fmt:check"]
run = "npm --prefix docsite run check"

[tasks."docs:fmt:check"]
description = "Check docsite configuration formatting"
depends = ["docs:install"]
run = "npm --prefix docsite run format:check"

[tasks."docs:build"]
description = "Build the Astro Starlight docsite from repository docs/"
depends = ["docs:check"]
run = "npm --prefix docsite run build"

[tasks."docs:ci"]
description = "Run the reproducible docsite install, checks, and production build"
depends = ["docs:build"]

[tasks.ci]
description = "Run the complete local validation suite"
depends = ["fmt:check", "lint", "check", "test", "build", "deno:fmt:check", "deno:check", "deno:test", "python:test", "docs:ci"]

[tasks.install-hooks]
description = "Configure the repository-local pre-commit hook"
run = "git config core.hooksPath .githooks"
